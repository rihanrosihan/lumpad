# PostgreSQL tuned for a 4 GB VPS shared with the Node app, Caddy and the Go server. Installed by deploy/v2/tune-4gb.sh as
# /etc/postgresql/16/main/conf.d/lumpad.conf (replaces the 2 GB file). Needs a Postgres RESTART for shared_buffers.
# Budget: Postgres about 1.3 GB under load (1 GB shared_buffers + sessions), Node ≤ 600 MB, Go ≤ 600 MB at peak, OS + Caddy + page cache the rest.
shared_buffers = 1GB
effective_cache_size = 2GB
work_mem = 8MB
maintenance_work_mem = 256MB
temp_buffers = 8MB
max_connections = 30
wal_buffers = 16MB
max_wal_size = 1GB
min_wal_size = 256MB
checkpoint_completion_target = 0.9
random_page_cost = 1.1
effective_io_concurrency = 100
autovacuum_max_workers = 3
autovacuum_work_mem = 128MB
max_worker_processes = 8
max_parallel_workers = 3
max_parallel_workers_per_gather = 2
huge_pages = off
jit = off
log_min_duration_statement = 500
# applied only when TimescaleDB is installed:
# shared_preload_libraries = 'timescaledb'
# timescaledb.max_background_workers = 4
