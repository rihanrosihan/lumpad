# PostgreSQL tuned for a 2 GB VPS shared with the Node app, Caddy and the Go server (redesign decision 18 Nov 2026: stay on 2 GB).
# Target: Postgres total about 450 MB under load. Drop into /etc/postgresql/16/main/conf.d/lumpad.conf and restart.
shared_buffers = 192MB
effective_cache_size = 640MB
work_mem = 4MB
maintenance_work_mem = 64MB
temp_buffers = 8MB
max_connections = 20
wal_buffers = 8MB
max_wal_size = 512MB
min_wal_size = 128MB
checkpoint_completion_target = 0.9
random_page_cost = 1.1
effective_io_concurrency = 100
autovacuum_max_workers = 2
autovacuum_work_mem = 32MB
max_worker_processes = 6
max_parallel_workers = 2
max_parallel_workers_per_gather = 1
huge_pages = off
jit = off
log_min_duration_statement = 500
# applied only when TimescaleDB is installed (ignored otherwise as an unrecognised parameter prefix is allowed for extensions that are loaded):
# shared_preload_libraries = 'timescaledb'
# timescaledb.max_background_workers = 3
