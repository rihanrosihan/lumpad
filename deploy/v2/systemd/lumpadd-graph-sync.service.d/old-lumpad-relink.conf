# OPTIONAL drop-in (not installed). After the daily graph sync, restore the old-notes layer's edges to Race nodes that the sync recreates ({src:'kbx'} races).
# Idempotent MERGE; the '-' prefix means a failure here can never fail the sync itself.
# Install (needs root):  sudo mkdir -p /etc/systemd/system/lumpadd-graph-sync.service.d && sudo cp deploy/v2/systemd/lumpadd-graph-sync.service.d/old-lumpad-relink.conf /etc/systemd/system/lumpadd-graph-sync.service.d/ && sudo systemctl daemon-reload
# Without it, run by hand when needed:  sudo -u lumpad node server/oldlumpad/cli.js graph-relink   (Day and Session links never need it; only the direct Race links to KB-sourced races do)
[Service]
ExecStartPost=-/usr/bin/bash -c 'cd /opt/lumpad && /usr/bin/node --disable-warning=ExperimentalWarning --max-old-space-size=96 server/oldlumpad/cli.js graph-relink'
